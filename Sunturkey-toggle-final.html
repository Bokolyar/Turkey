<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunturkey · Toggle (финал)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Manrope', sans-serif; background: #F7F4EE; color: #0E1B1A; -webkit-font-smoothing: antialiased; }
  /* Section wrap so the block looks like it sits in a real page */
  .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  /* ───────── Compare block ───────── */
  .cmp { width: 100%; max-width: 920px; }
  .cmp__head { text-align: center; margin-bottom: 28px; }
  .cmp__title { font-size: clamp(26px, 4.2vw, 44px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }
  .cmp__title em { font-style: normal; color: var(--accent); }
  .cmp__sub { font-size: clamp(14px, 1.7vw, 16px); line-height: 1.55; color: #6B7570; max-width: 540px; margin: 0 auto; text-wrap: pretty; }

  /* Toggle */
  .tog { position: relative; display: inline-flex; background: #fff; border-radius: 999px; padding: 4px; margin: 0 auto 24px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px rgba(14,27,26,.06); }
  .tog__container { display: flex; justify-content: center; }
  .tog__pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background-color: var(--accent); transition: transform .35s cubic-bezier(.5,.2,.2,1), background-color .25s; z-index: 0; box-shadow: 0 4px 14px rgba(46,190,174,.35); }
  .cmp[data-side="bad"] .tog__pill { transform: translateX(100%); background-color: var(--danger); box-shadow: 0 4px 14px rgba(233,115,115,.35); }
  .tog__btn { position: relative; z-index: 1; appearance: none; border: 0; background: transparent; padding: 11px 22px; min-width: 140px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: #6B7570; transition: color .25s; white-space: nowrap; }
  .tog__btn[aria-pressed="true"] { color: #fff; }
  .tog__btn:focus-visible { outline: 2px solid #0E1B1A; outline-offset: 3px; border-radius: 999px; }
  .tog__count { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.25); }
  .tog__btn[aria-pressed="false"] .tog__count { background: rgba(14,27,26,.06); }

  /* List */
  .list { background: #fff; border: 1px solid #ECE6D8; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 12px 32px rgba(14,27,26,.05); }
  .row { display: grid; grid-template-columns: 220px 1fr; gap: 20px; padding: 18px 24px; align-items: center; border-top: 1px solid #ECE6D8; }
  .row:first-child { border-top: 0; }
  .row__label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9AA3A0; }
  .row__body { display: flex; gap: 12px; align-items: flex-start; min-height: 28px; }
  .row__icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; transition: background .25s; }
  .cmp[data-side="good"] .row__icon { background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--accent); }
  .cmp[data-side="bad"]  .row__icon { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); }
  .row__text { font-size: 15px; line-height: 1.55; font-weight: 500; flex: 1; position: relative; }
  .row__text > span { display: block; transition: opacity .25s, transform .25s; }
  .row__text > span.is-hidden { opacity: 0; pointer-events: none; position: absolute; inset: 0; transform: translateY(-4px); }

  /* Footer summary */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 18px; padding: 14px 22px; background: #fff; border: 1px solid #ECE6D8; border-radius: 14px; }
  .foot__hint { font-size: 13px; color: #6B7570; display: flex; align-items: center; gap: 10px; }
  .foot__dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); transition: background .25s; }
  .cmp[data-side="bad"] .foot__dot { background: var(--danger); }
  .foot__cta { appearance: none; border: 0; background: var(--accent); color: #fff; font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: .02em; padding: 12px 22px; border-radius: 999px; cursor: pointer; transition: transform .15s, filter .2s, background .25s; }
  .foot__cta:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .cmp[data-side="bad"] .foot__cta { background: #0E1B1A; }

  /* Mobile */
  @media (max-width: 640px) {
    .page { padding: 28px 16px; }
    .cmp__head { margin-bottom: 20px; }
    .tog { width: 100%; margin-bottom: 16px; }
    .tog__container { display: block; }
    .tog__btn { flex: 1; min-width: 0; padding: 11px 8px; font-size: 12px; }
    .tog { display: flex; }
    .row { grid-template-columns: 1fr; gap: 6px; padding: 16px 18px; }
    .row__label { font-size: 11px; }
    .row__text { font-size: 14px; }
    .foot { padding: 14px 16px; }
    .foot__cta { width: 100%; padding: 14px; }
  }

  /* Tweaks defaults */
  :root {
    --accent: #2EBEAE;
    --danger: #E97373;
  }
</style>
</head>
<body>
<div class="page">
  <section class="cmp" id="compare" data-side="good" aria-label="Сравнение подходов к подбору отеля">
    <div class="cmp__head">
      <h2 class="cmp__title" id="cmp-title">Один и тот же бюджет — <em>две разные поездки</em></h2>
      <p class="cmp__sub" id="cmp-sub">Переключите вид и посмотрите, что получает семья при «обычном» бронировании и что — с нашим экспертным подбором.</p>
    </div>

    <div class="tog__container">
      <div class="tog" role="tablist" aria-label="Выберите вариант сравнения">
        <span class="tog__pill" aria-hidden="true"></span>
        <button class="tog__btn" role="tab" aria-pressed="true"  data-side="good" id="tab-good">Наш выбор<span class="tog__count" id="cnt-good">6</span></button>
        <button class="tog__btn" role="tab" aria-pressed="false" data-side="bad"  id="tab-bad">Обычные отели<span class="tog__count" id="cnt-bad">6</span></button>
      </div>
    </div>

    <ol class="list" id="cmp-list"></ol>

    <div class="foot">
      <div class="foot__hint"><span class="foot__dot"></span><span id="foot-text">Все 6 пунктов уже включены в наш подбор</span></div>
      <button class="foot__cta" id="foot-cta">Подобрать отель бесплатно</button>
    </div>
  </section>
</div>

<!-- Tweakable defaults the host can rewrite -->
<script>
window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
  "accent": "#2EBEAE",
  "danger": "#E97373",
  "title": "Один и тот же бюджет — <em>две разные поездки</em>",
  "subtitle": "Переключите вид и посмотрите, что получает семья при «обычном» бронировании и что — с нашим экспертным подбором.",
  "ctaText": "Подобрать отель бесплатно",
  "showCount": true,
  "defaultSide": "good"
}/*EDITMODE-END*/;
</script>

<script>
const DATA = [
  { label: "Дорога и трансфер",   bad: "Изнурительный путь 2–3 часа с заездами в десятки отелей по пути.", good: "Комфортная логистика. Отели в 30–60 мин от аэропорта или быстрый трансфер." },
  { label: "Детский клуб",        bad: "«Комната с раскрасками». Один уставший аниматор на всех детей.",   good: "Разделение по возрастам (0+, 4+, 8+, 12+). Профессиональные педагоги." },
  { label: "Питание и сервис",    bad: "Очереди, шум в ресторане, меню из полуфабрикатов (фри/наггетсы).", good: "Детское кафе и здоровое меню. Свежие каши, баночное питание, блендеры." },
  { label: "Здоровье и гигиена",  bad: "Риск инфекций из-за переполненности и формальной очистки бассейнов.", good: "Строгий санитарный контроль. Ежедневная дезинфекция и контроль воды 24/7." },
  { label: "Тишина и сон",        bad: "Шумная анимация под окнами номеров, мешающая дневному сну.",       good: "Зонирование территории. Игровые зоны удалены от жилых корпусов." },
  { label: "Забота о маме",       bad: "Платная аренда колясок, отсутствие элементарных вещей.",           good: "Всё под рукой. Коляски, горшки, радионяни и ванночки уже ждут вас." },
];

const T = window.__TWEAKS__;
const root = document.documentElement;
root.style.setProperty('--accent', T.accent);
root.style.setProperty('--danger', T.danger);

const cmp = document.getElementById('compare');
const list = document.getElementById('cmp-list');
const tabGood = document.getElementById('tab-good');
const tabBad  = document.getElementById('tab-bad');
const cntGood = document.getElementById('cnt-good');
const cntBad  = document.getElementById('cnt-bad');
const titleEl = document.getElementById('cmp-title');
const subEl   = document.getElementById('cmp-sub');
const footEl  = document.getElementById('foot-text');
const ctaEl   = document.getElementById('foot-cta');

const ICON_GOOD = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BAD  = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

function renderHead() {
  titleEl.innerHTML = T.title;
  subEl.textContent = T.subtitle;
  ctaEl.textContent = T.ctaText;
  cntGood.style.display = T.showCount ? '' : 'none';
  cntBad.style.display  = T.showCount ? '' : 'none';
  cntGood.textContent = DATA.length;
  cntBad.textContent  = DATA.length;
}

function renderList() {
  list.innerHTML = DATA.map((d) => `
    <li class="row">
      <div class="row__label">${d.label}</div>
      <div class="row__body">
        <span class="row__icon" id="icon-${d.label}"></span>
        <div class="row__text">
          <span class="is-good">${d.good}</span>
          <span class="is-bad is-hidden">${d.bad}</span>
        </div>
      </div>
    </li>
  `).join('');
  syncIcons();
}

function syncIcons() {
  const side = cmp.dataset.side;
  document.querySelectorAll('.row__icon').forEach(el => {
    el.innerHTML = side === 'good' ? ICON_GOOD : ICON_BAD;
  });
  document.querySelectorAll('.row__text .is-good').forEach(el => el.classList.toggle('is-hidden', side !== 'good'));
  document.querySelectorAll('.row__text .is-bad').forEach(el  => el.classList.toggle('is-hidden', side !== 'bad'));
  footEl.textContent = side === 'good'
    ? `Все ${DATA.length} пунктов уже включены в наш подбор`
    : `${DATA.length} проблем, с которыми сталкиваются обычные туристы`;
  tabGood.setAttribute('aria-pressed', side === 'good');
  tabBad.setAttribute('aria-pressed', side === 'bad');
}

function setSide(side) {
  cmp.dataset.side = side;
  syncIcons();
}

tabGood.addEventListener('click', () => setSide('good'));
tabBad.addEventListener('click',  () => setSide('bad'));

renderHead();
renderList();
setSide(T.defaultSide || 'good');
</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-presets="react">
  function Panel() {
    const { TweaksPanel, useTweaks, TweakSection, TweakColor, TweakText, TweakToggle, TweakRadio } = window;
    const [t, setTweak] = useTweaks(window.__TWEAKS__);

    React.useEffect(() => {
      window.__TWEAKS__ = t;
      const r = document.documentElement;
      r.style.setProperty('--accent', t.accent);
      r.style.setProperty('--danger', t.danger);
      document.getElementById('cmp-title').innerHTML = t.title;
      document.getElementById('cmp-sub').textContent = t.subtitle;
      document.getElementById('foot-cta').textContent = t.ctaText;
      document.getElementById('cnt-good').style.display = t.showCount ? '' : 'none';
      document.getElementById('cnt-bad').style.display  = t.showCount ? '' : 'none';
      document.getElementById('compare').dataset.side = t.defaultSide;
      // re-sync icons & visible text
      const side = t.defaultSide;
      document.querySelectorAll('.row__text .is-good').forEach(el => el.classList.toggle('is-hidden', side !== 'good'));
      document.querySelectorAll('.row__text .is-bad').forEach(el  => el.classList.toggle('is-hidden', side !== 'bad'));
    }, [t]);

    return (
      <TweaksPanel title="Tweaks">
        <TweakSection title="Цвета">
          <TweakColor label="Акцент (наш)"   value={t.accent} onChange={(v) => setTweak('accent', v)} />
          <TweakColor label="Контраст (обычные)" value={t.danger} onChange={(v) => setTweak('danger', v)} />
        </TweakSection>
        <TweakSection title="Текст">
          <TweakText label="Заголовок (можно <em>…</em>)" value={t.title} onChange={(v) => setTweak('title', v)} />
          <TweakText label="Подзаголовок" value={t.subtitle} onChange={(v) => setTweak('subtitle', v)} multiline />
          <TweakText label="Текст кнопки" value={t.ctaText} onChange={(v) => setTweak('ctaText', v)} />
        </TweakSection>
        <TweakSection title="Поведение">
          <TweakRadio label="По умолчанию показано"
                      value={t.defaultSide}
                      options={[{ value: 'good', label: 'Наш выбор' }, { value: 'bad', label: 'Обычные' }]}
                      onChange={(v) => setTweak('defaultSide', v)} />
          <TweakToggle label="Показывать счётчик" value={t.showCount} onChange={(v) => setTweak('showCount', v)} />
        </TweakSection>
      </TweaksPanel>
    );
  }

  const mount = document.createElement('div');
  document.body.appendChild(mount);
  ReactDOM.createRoot(mount).render(<Panel />);
</script>
</body>
</html>
